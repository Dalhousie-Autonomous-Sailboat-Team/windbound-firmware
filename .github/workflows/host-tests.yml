# Proves the firmware without the boat: its unit tests on the host, then the
# simulator's tests, which load the firmware's control and protocol code as a
# library and sail it (sim/README.md).
name: Host tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the firmware for the host
        run: |
          cmake --preset Host-Tests
          cmake --build --preset Host-Tests

      - name: Firmware unit tests
        run: ctest --preset Host-Tests

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sim/requirements.txt

      - name: Simulator tests
        if: ${{ !cancelled() }}
        working-directory: sim
        run: |
          pip install -r requirements.txt
          python -m pytest -q -rxX
